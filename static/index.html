<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Support Assistant</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar-bot">
          <i data-lucide="bot"></i>
        </div>
        <div>
          <h2>AI Support Assistant</h2>
          <span class="status-online"><span class="status-dot"></span> Online</span>
        </div>
      </div>
    </header>

    <!-- Chat Messages Scroll Area -->
    <main class="chat-messages" id="chat-messages">
      <div class="message assistant">
        <div class="message-content">
          Hello! 👋 How can I assist you today? You can ask me about order tracking, delivery timelines, or return policies.
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area">
      <form id="chat-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Type your message..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="send-btn">
          <i data-lucide="send"></i>
        </button>
      </form>
    </footer>
  </div>

  <script src="/static/script.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
