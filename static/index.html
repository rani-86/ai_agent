<!DOCTYPE html>
<html>
<head>
  <title>AI Agent Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .user { color: #0066cc; margin: 8px 0; }
    .bot { color: #333; margin: 8px 0; }
    input { width: 80%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>AI Agent Chat</h2>
  <div id="chat"></div>
  <input id="msg" placeholder="Type a message..." onkeydown="if(event.key==='Enter') send()">
  <button onclick="send()">Send</button>

  <script>
    const userId = "user_" + Math.random().toString(36).substring(7);
    async function send() {
      const input = document.getElementById("msg");
      const chat = document.getElementById("chat");
      const text = input.value.trim();
      if (!text) return;
      chat.innerHTML += `<div class="user"><b>You:</b> ${text}</div>`;
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, message: text })
      });
      const data = await res.json();
      chat.innerHTML += `<div class="bot"><b>Agent:</b> ${data.response}</div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
